<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.5 system-ui, sans-serif;
        color: #202124;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      label.toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 96px;
        margin-top: 4px;
        font: 12px/1.4 ui-monospace, monospace;
      }
      .hint {
        color: #5f6368;
        font-size: 12px;
      }
      .sub {
        margin: 0 0 10px 24px;
      }
      .sub textarea {
        height: 56px;
      }
      .hours {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0 0 10px 24px;
      }
      .hours input {
        width: 44px;
      }
      #errors {
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
        color: #d93025;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>GCal Utils</h1>
    <label class="toggle"><input type="checkbox" id="merge" /> Merge duplicate events</label>
    <div class="sub">
      <label for="priority">Priority calendars <span class="hint">(one calendar ID per line, top first; your own calendar always comes first)</span></label>
      <textarea id="priority" spellcheck="false" placeholder="team@group.calendar.google.com"></textarea>
    </div>
    <label class="toggle"><input type="checkbox" id="hide" /> Hide events by regex</label>
    <label class="toggle"><input type="checkbox" id="solo" /> Solo button on calendar list</label>
    <label class="toggle"><input type="checkbox" id="fold" /> Fold early morning and late night</label>
    <div class="hours">
      <label>Early morning <span class="hint">00:00 –</span> <input type="number" id="earlyEnd" min="0" max="24" step="1" /><span class="hint">:00</span></label>
      <label>Late night <input type="number" id="lateStart" min="0" max="24" step="1" /><span class="hint">:00 – 24:00</span></label>
    </div>
    <div>
      <label for="patterns">Hide patterns <span class="hint">(one regex per line, case-insensitive)</span></label>
      <textarea id="patterns" spellcheck="false" placeholder="^Lunch$&#10;Focus time"></textarea>
      <ul id="errors"></ul>
    </div>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
